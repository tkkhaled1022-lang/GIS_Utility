<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HydroGIS Utility - الرفع المساحي المطور</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/webtonative@1.0.0/webtonative.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; margin: 0; padding: 15px; background: #eef2f5; color: #333; }
        h2 { text-align: center; color: #2c3e50; margin: 5px 0; }
        .main-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        #map { flex: 2; height: 400px; min-width: 300px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 2px solid white; }
        .form-panel { flex: 1; background: white; padding: 18px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.12); max-width: 420px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        input { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 5px; color: white; font-size: 16px; cursor: pointer; margin-bottom: 9px; font-weight: bold; }
        .btn-location { background: #e67e22; }
        .btn-save { background: #27ae60; }
        .btn-export { background: #3498db; }
        .gps-panel { background: #f8f9fa; border-radius: 7px; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; }
        .status-box { text-align: center; padding: 9px; margin-top: 8px; border-radius: 5px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🌐 HydroGIS Utility</h2>
    <div class="main-container">
        <div id="map"></div>
        <div class="form-panel">
            <button id="locationBtn" class="btn btn-location" onclick="startHighAccuracyGPS()">📍 تحديد موقعي (سريع)</button>
            <div class="gps-panel">
                <div class="gps-row">Lat: <strong id="gpsLat">---</strong> | Lng: <strong id="gpsLng">---</strong></div>
                <div class="gps-row">الدقة: <strong id="gpsAccuracy">---</strong> متر</div>
                <div id="gpsStatus" class="status-box">اضغط لتحديد الموقع</div>
            </div>
            
            <input type="hidden" id="lat"><input type="hidden" id="lng"><input type="hidden" id="accuracy">
            
            <div class="form-group"><label>رقم المطبق:</label><input type="text" id="pointName"></div>
            <div class="form-group"><label>عمق المطبق (م):</label><input type="number" step="0.01" id="manholeDepth"></div>
            <button id="saveBtn" class="btn btn-save" onclick="saveOrUpdateRecord()">💾 حفظ البيانات</button>
            <button class="btn btn-export" onclick="exportToExcel()">📊 تصدير Excel</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([30.0444, 31.2357], 10);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 20}).addTo(map);

        let tableData = JSON.parse(localStorage.getItem('hydrogis_manholes_data')) || [];
        let latestPosition = null;

        function startHighAccuracyGPS() {
            const btn = document.getElementById("locationBtn");
            btn.innerText = "جاري البحث...";
            
            navigator.geolocation.watchPosition(pos => {
                latestPosition = pos;
                document.getElementById("gpsLat").innerText = pos.coords.latitude.toFixed(6);
                document.getElementById("gpsLng").innerText = pos.coords.longitude.toFixed(6);
                document.getElementById("gpsAccuracy").innerText = pos.coords.accuracy.toFixed(1);
                document.getElementById("gpsStatus").innerText = "✅ GPS متصل";
                document.getElementById("gpsStatus").style.background = "#d4edda";
                btn.innerText = "📍 تحديث الموقع";
            }, err => {
                alert("خطأ في GPS: " + err.message);
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        function saveOrUpdateRecord() {
            // نظام مرونة الحفظ: إذا وجدت قراءة استخدمها، وإلا لا تحفظ
            if (!latestPosition) return alert("⚠️ لم يتم تحديد الموقع بعد، يرجى الانتظار");

            // تنبيه عند الدقة الضعيفة بدلاً من منع الحفظ
            if (latestPosition.coords.accuracy > 30) {
                if (!confirm("⚠️ دقة الموقع ضعيفة (" + latestPosition.coords.accuracy.toFixed(1) + "م). هل تريد الحفظ؟")) return;
            }

            const record = {
                pointName: document.getElementById('pointName').value,
                lat: latestPosition.coords.latitude,
                lng: latestPosition.coords.longitude,
                manholeDepth: document.getElementById('manholeDepth').value
            };
            
            tableData.push(record);
            localStorage.setItem('hydrogis_manholes_data', JSON.stringify(tableData));
            alert("تم الحفظ!");
        }

        function exportToExcel() {
            if (tableData.length === 0) return alert("لا توجد بيانات!");
            const ws = XLSX.utils.json_to_sheet(tableData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "البيانات");
            XLSX.writeFile(wb, "HydroGIS_Report.xlsx");
        }
    </script>
</body>
</html>
