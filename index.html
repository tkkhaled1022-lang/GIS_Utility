<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroGIS Utility - نظام إدارة شبكات الصرف الصحي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- مكتبة SheetJS لملفات Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #eef2f5; }
        h2 { text-align: center; color: #2c3e50; }
        .main-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        #map { flex: 2; height: 400px; min-width: 300px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; }
        .form-group { margin-bottom: 10px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-save { background-color: #27ae60; }
        .btn-export { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <h2>🌐 HydroGIS Utility</h2>

    <div class="main-container">
        <div id="map"></div>
        <div class="form-panel">
            <button class="btn" style="background-color:#e67e22;" onclick="getLocation()">📍 تحديث إحداثيات الموقع</button>
            <input type="hidden" id="lat"><input type="hidden" id="lng">
            <div class="form-group"><input type="text" id="pointName" placeholder="رقم المطبق (مثال: MH-105)"></div>
            <div class="form-group"><input type="number" step="0.01" id="manholeDepth" placeholder="عمق المطبق (م)"></div>
            <div class="form-group"><input type="number" step="0.01" id="pipeCrownDepth" placeholder="عمق الوش (م)"></div>
            <div class="form-group"><input type="number" id="pipeDiameter" placeholder="القطر (مم)"></div>
            <div class="form-group"><input type="text" id="notes" placeholder="ملاحظات"></div>
            <button class="btn btn-save" onclick="saveRecord()">💾 حفظ البيانات</button>
        </div>
    </div>

    <table id="dataTable">
        <thead>
            <tr><th>م</th><th>رقم المطبق</th><th>Lat</th><th>Lng</th><th>العمق</th><th>عمق الوش</th><th>القطر</th><th>ملاحظات</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <button class="btn btn-export" onclick="exportToExcel()">📥 تحميل ملف Excel احترافي</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let tableData = JSON.parse(localStorage.getItem('hydrogis_data')) || [];

        function renderTable() {
            const tbody = document.querySelector("#dataTable tbody");
            tbody.innerHTML = tableData.map((item, index) => `<tr>
                <td>${index+1}</td><td>${item.pointName}</td><td>${item.lat}</td><td>${item.lng}</td>
                <td>${item.manholeDepth}</td><td>${item.pipeCrownDepth}</td><td>${item.pipeDiameter}</td><td>${item.notes}</td>
            </tr>`).join('');
        }

        function saveRecord() {
            const record = {
                pointName: document.getElementById('pointName').value,
                lat: document.getElementById('lat').value,
                lng: document.getElementById('lng').value,
                manholeDepth: document.getElementById('manholeDepth').value,
                pipeCrownDepth: document.getElementById('pipeCrownDepth').value,
                pipeDiameter: document.getElementById('pipeDiameter').value,
                notes: document.getElementById('notes').value
            };
            tableData.push(record);
            localStorage.setItem('hydrogis_data', JSON.stringify(tableData));
            renderTable();
        }

        function exportToExcel() {
            if (tableData.length === 0) return alert("لا توجد بيانات!");
            // تحويل البيانات لملف إكسيل
            const ws = XLSX.utils.json_to_sheet(tableData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "البيانات");
            XLSX.writeFile(wb, "HydroGIS_Report.xlsx");
        }

        function getLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lng').value = pos.coords.longitude;
                alert("تم تحديث الإحداثيات!");
            });
        }
        renderTable();
    </script>
</body>
</html>
